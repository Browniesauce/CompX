[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compx"
version = "0.1.0"
description = "A local-first catalog for laptop and desktop configurations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.12,<1", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
compx = "compx.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compx = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
